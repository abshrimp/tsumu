name: Extra Style Export Builds

on:
  pull_request:
    paths:
      - "lib/generator/**"
      - "lib/export-formats.ts"
      - "scripts/smoke-export-build.mts"
      - ".github/workflows/tailwind.yml"
  push:
    branches: [main]
    paths:
      - "lib/generator/**"
      - "lib/export-formats.ts"
      - "scripts/smoke-export-build.mts"
      - ".github/workflows/tailwind.yml"

permissions:
  contents: read

concurrency:
  group: audit-f-tailwind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extra-style-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { framework: nextjs, style: tailwind, language: typescript }
          - { framework: nextjs, style: tailwind, language: javascript }
          - { framework: react, style: tailwind, language: typescript }
          - { framework: react, style: tailwind, language: javascript }
          - { framework: vue, style: tailwind, language: typescript }
          - { framework: vue, style: tailwind, language: javascript }
          - { framework: sveltekit, style: tailwind, language: typescript }
          - { framework: sveltekit, style: tailwind, language: javascript }
          - { framework: vue, style: css-modules, language: typescript }
          - { framework: vue, style: css-modules, language: javascript }
          - { framework: nuxt, style: css-modules, language: typescript }
          - { framework: nuxt, style: css-modules, language: javascript }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - name: Generate alternate-style site
        run: node --import tsx scripts/smoke-export-build.mts ${{ matrix.framework }} ${{ matrix.language }} ${{ matrix.style }}
      - name: Build and audit independent generated project
        working-directory: .generated-export-smoke
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
      - name: Verify SSR output
        run: node --import tsx scripts/check-generated-ssr.mts ${{ matrix.framework }}
