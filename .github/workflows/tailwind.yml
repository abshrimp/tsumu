name: Extra Style Export Builds

on:
  pull_request:
    paths:
      - "lib/generator/**"
      - "lib/export-formats.ts"
      - "scripts/smoke-export-build.mts"
      - ".github/workflows/tailwind.yml"
  push:
    branches: [main]
    paths:
      - "lib/generator/**"
      - "lib/export-formats.ts"
      - "scripts/smoke-export-build.mts"
      - ".github/workflows/tailwind.yml"

permissions:
  contents: read

concurrency:
  group: extra-style-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extra-style-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { framework: nextjs, style: tailwind }
          - { framework: react, style: tailwind }
          - { framework: vue, style: tailwind }
          - { framework: sveltekit, style: tailwind }
          - { framework: vue, style: css-modules }
          - { framework: nuxt, style: css-modules }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate, build, audit, and verify TypeScript and JavaScript exports
        shell: bash
        run: |
          set -euo pipefail
          for language in typescript javascript; do
            echo "::group::${{ matrix.framework }} (${{ matrix.style }}, $language)"
            node --import tsx scripts/smoke-export-build.mts "${{ matrix.framework }}" "$language" "${{ matrix.style }}"
            (
              cd .generated-export-smoke
              npm install --prefer-offline --no-audit --no-fund
              npm run build
              npm audit --audit-level=high
            )
            node --import tsx scripts/check-generated-ssr.mts "${{ matrix.framework }}"
            echo "::endgroup::"
          done
